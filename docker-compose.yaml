services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    depends_on:
      db:
        condition: service_healthy

    networks:
      - my-network

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/eBazzar_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: asdf
    command: ["./mvnw", "spring-boot:run"]
    # command: ["sh", "-c", "sleep 10 && ./mvnw spring-boot:run"] db health check added so not needed

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: asdf
      MYSQL_DATABASE: eBazzar_db
    ports:
      - "3306:3306"
    volumes:
      - ./data/db/mysql:/var/lib/mysql
    networks:
      - my-network

    # pining db for initialization
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

networks:
  my-network:
    driver: bridge
